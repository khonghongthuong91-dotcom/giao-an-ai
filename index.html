<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APP Tạo Giáo Án — soạn giáo án mầm non</title>
  <meta name="description" content="Wizard 5 bước dựng giáo án mầm non đúng bố cục I – II – III với bảng hai cột hoạt động của cô và của trẻ. Sửa trực tiếp, tải Word, chuyển thành PowerPoint.">
  <meta name="color-scheme" content="light">

  <!-- Bông hoa của app làm biểu tượng tab. Dùng SVG nên nét ở mọi cỡ màn hình. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="favicon.svg">

  <!--
    Ảnh xem trước khi dán link vào Zalo, Messenger, Facebook…
    og:image BẮT BUỘC là đường dẫn tuyệt đối — dán link ở app khác thì máy chủ
    của họ đi lấy ảnh, đường dẫn tương đối là hỏng.
    Cũng bắt buộc là ảnh raster (PNG/JPG): phần lớn nền tảng không đọc SVG.
    Các file tĩnh không bị chặn đăng nhập nên bot lấy được ảnh bình thường.
  -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="APP Tạo Giáo Án">
  <meta property="og:url" content="https://giaoan.workzone.ai.vn/">
  <meta property="og:title" content="APP Tạo Giáo Án — soạn giáo án mầm non">
  <meta property="og:description" content="Wizard 5 bước dựng giáo án mầm non đúng bố cục I – II – III với bảng hai cột hoạt động của cô và của trẻ. Sửa trực tiếp, tải Word, chuyển thành PowerPoint.">
  <meta property="og:image" content="https://giaoan.workzone.ai.vn/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="APP Tạo Giáo Án — soạn giáo án mầm non đúng bố cục, trong vài phút.">
  <meta property="og:locale" content="vi_VN">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="APP Tạo Giáo Án — soạn giáo án mầm non">
  <meta name="twitter:description" content="Wizard 5 bước dựng giáo án mầm non đúng bố cục I – II – III. Sửa trực tiếp, tải Word, chuyển thành PowerPoint.">
  <meta name="twitter:image" content="https://giaoan.workzone.ai.vn/og-image.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Toàn bộ giao diện do js/app.js dựng vào đây. -->
  <div id="app"></div>

  <!-- Input file ẩn cho màn hình "Tải Word lên". -->
  <input id="docx-picker" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>

  <!--
    Tất cả đều là script cổ điển (không phải ES module) để app mở được bằng cách
    bấm đúp index.html — trình duyệt chặn `import` trên giao thức file://.
    Thứ tự nạp là bắt buộc: dữ liệu và tiện ích trước, app.js sau cùng.
  -->
  <script src="js/data.js"></script>
  <script src="js/compose.js"></script>
  <script src="js/zip.js"></script>
  <script src="js/docx.js"></script>
  <script src="js/pptx.js"></script>
  <script src="js/docx-read.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
