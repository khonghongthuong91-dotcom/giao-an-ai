# APP Tạo Giáo Án — truy cập tạm bằng IP:cổng, chưa có tên miền.
#
#   http://194.233.78.124:8080/
#
# TẠM THỜI, KHÔNG CÓ HTTPS. Mật khẩu basic auth đi qua mạng ở dạng gần như thô
# (chỉ base64), ai bắt được gói tin là đọc ra. Có tên miền rồi thì chuyển sang
# nginx-giaoan.conf.template và xoá file này.
#
# Container vẫn chỉ nghe 127.0.0.1:3060 — nginx là thứ duy nhất chạm tới nó,
# nên mọi request bắt buộc đi qua lớp mật khẩu bên dưới.

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    # Không còn auth_basic: app tự xác thực bằng form đăng nhập và cookie phiên.
    # LƯU Ý cổng này chạy HTTP trần — cookie phiên đi qua mạng không mã hoá.
    # Chỉ dùng tạm; đường chính thức là https://giaoan.workzone.ai.vn.

    # Giáo viên tải file .docx lên để chuyển thành PowerPoint.
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Soạn một giáo án đầy đủ từng mất khoảng 2 phút; timeout phải rộng hơn hẳn
    # và khớp với trần 4 phút trong ai-server.mjs.
    location /api/generate {
        limit_req zone=giaoan_ai burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
