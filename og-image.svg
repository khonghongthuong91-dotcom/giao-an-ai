<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18BFA7"/>
      <stop offset="1" stop-color="#0B8C86"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <circle cx="1040" cy="120" r="230" fill="#ffffff" opacity="0.07"/>
  <circle cx="1150" cy="520" r="170" fill="#ffffff" opacity="0.06"/>

  <g transform="translate(90 96)">
    <rect width="86" height="86" rx="24" fill="#ffffff"/>
    <g transform="translate(13 13) scale(2.5)">
      <ellipse cx="12" cy="5.4" rx="3.3" ry="4.8" fill="#18BFA7"/>
      <ellipse cx="12" cy="5.4" rx="3.3" ry="4.8" fill="#18BFA7" transform="rotate(60 12 12)"/>
      <ellipse cx="12" cy="5.4" rx="3.3" ry="4.8" fill="#18BFA7" transform="rotate(120 12 12)"/>
      <ellipse cx="12" cy="5.4" rx="3.3" ry="4.8" fill="#18BFA7" transform="rotate(180 12 12)"/>
      <ellipse cx="12" cy="5.4" rx="3.3" ry="4.8" fill="#18BFA7" transform="rotate(240 12 12)"/>
      <ellipse cx="12" cy="5.4" rx="3.3" ry="4.8" fill="#18BFA7" transform="rotate(300 12 12)"/>
      <circle cx="12" cy="12" r="4.4" fill="#F8C85E"/>
    </g>
  </g>

  <text x="200" y="130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="700" fill="#ffffff" letter-spacing="3">APP TẠO GIÁO ÁN</text>
  <text x="200" y="170" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="23" fill="#D8F4EF">Trợ lý AI cho giáo viên mầm non</text>

  <text x="90" y="300" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="62" font-weight="700" fill="#ffffff">Soạn giáo án mầm non</text>
  <text x="90" y="378" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="62" font-weight="700" fill="#ffffff">đúng bố cục, trong vài phút.</text>

  <text x="90" y="440" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="26" fill="#CDEFE9">Wizard 5 bước · bảng hai cột hoạt động của cô và của trẻ</text>

  <!--
    Bề rộng viên thuốc = bề rộng chữ đo thật + 28px đệm mỗi bên.
    Đo bằng canvas measureText ở đúng font/cỡ này: 233px và 224px.
    SVG không tự co giãn khung theo chữ, nên đặt số bừa là chữ tràn ra ngoài —
    bản trước đúng như vậy.
    Chữ canh giữa (text-anchor=middle) chứ không canh trái: nếu bộ render dùng
    font hơi khác thì sai số chia đều hai bên, không đẩy chữ lòi ra mép phải.
  -->
  <g transform="translate(90 490)">
    <rect width="289" height="52" rx="26" fill="#ffffff" opacity="0.16"/>
    <text x="144.5" y="34" text-anchor="middle"
          font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="22" font-weight="600" fill="#ffffff">Tải Word · PowerPoint</text>

    <rect x="311" width="280" height="52" rx="26" fill="#ffffff" opacity="0.16"/>
    <text x="451" y="34" text-anchor="middle"
          font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="22" font-weight="600" fill="#ffffff">Kiểm tra chuyên môn</text>
  </g>
</svg>
